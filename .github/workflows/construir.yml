name: Construir sitio
# Cada vez que cambia el contenido (lo publica el panel de Lo Común), se regeneran
# index.html y las páginas de cada sección (desde fuente/sitio.html), las páginas de analisis/, contenido/feed.json, sitemap.xml y llms.txt, y se publican.
on:
  push:
    branches: [main]
    paths:
      - 'contenido/publicaciones/**'
      - 'contenido/monitor/**'
      - 'scripts/**'
      - 'fuente/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/construir.mjs
      - name: Publicar cambios
        run: |
          git config user.name "Lo Común (construcción automática)"
          git config user.email "construccion@users.noreply.github.com"
          git add index.html metodo.html publicaciones.html monitor.html etica.html equipo.html aportes.html analisis css contenido/feed.json sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Construcción automática del sitio"
          git pull --rebase origin main
          git push
      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: |
          sleep 90
          node scripts/indexnow.mjs
