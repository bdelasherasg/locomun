name: Construir sitio
# Cada vez que cambia el contenido (lo publica el panel de Lo Común), se regeneran
# index.html, las páginas de analisis/ y contenido/feed.json, y se publican.
on:
  push:
    branches: [main]
    paths:
      - 'contenido/publicaciones/**'
      - 'contenido/monitor/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/construir.mjs
      - name: Publicar cambios
        run: |
          git config user.name "Lo Común (construcción automática)"
          git config user.email "construccion@users.noreply.github.com"
          git add index.html analisis contenido/feed.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Construcción automática del sitio"
          git pull --rebase origin main
          git push
